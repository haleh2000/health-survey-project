# Usage:  cp .env.example .env  &&  docker compose up -d --build
#
# Local:   http://localhost:5173  (app)   http://localhost:8000  (API)
# Server:  ports are bound to 127.0.0.1 only; the host nginx reverse-proxies
#          https://form.dayins.ir/health-analysis/ -> frontend and
#          https://form.dayins.ir/health-analysis/api/ -> backend.
#          See deploy/nginx-form.dayins.ir.conf.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: health_survey
      MYSQL_USER: health_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_PORT:-3307}:3306"

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://health_app:${DB_APP_PASSWORD}@db:3306/health_survey
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"

volumes:
  db_data:
