# Add these two blocks INSIDE the existing `server { ... }` for form.dayins.ir
# (the HTTPS one, `listen 443 ssl`), before its `location / { ... }` block.
#
# Both blocks strip the /health-analysis prefix, so the containers keep
# serving from "/" and need no changes.
#
# Requires the containers to be built with (in .env):
#   VITE_BASE_PATH=/health-analysis/
#   VITE_API_URL=/health-analysis/api
#
# Reload with:  sudo nginx -t && sudo systemctl reload nginx

    # --- health-analysis: API -> backend container (port 47392) ---
    location /health-analysis/api/ {
        proxy_pass         http://127.0.0.1:47392/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # --- health-analysis: app -> frontend container (port 47391) ---
    location = /health-analysis {
        return 301 /health-analysis/;
    }

    location /health-analysis/ {
        proxy_pass         http://127.0.0.1:47391/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
