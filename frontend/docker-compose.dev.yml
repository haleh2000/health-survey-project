version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "6002:6002"
    env_file:
      - .dev.env
    environment:
      - VITE_API_BASE_URL=http://localhost:6001
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 6002

networks:
  default:
    external: true
    name: health_survay_panel_back_app-network