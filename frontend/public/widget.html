<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پشتیابی آنلاین</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f8fcfd;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .support-container {
        text-align: center;
        max-width: 100%;
      }
      .support-button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 16px 28px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #12adc1 0%, #078ba0 100%);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(17, 164, 184, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .support-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(17, 164, 184, 0.4);
      }
      .support-button:active {
        transform: translateY(0);
      }
      .support-button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(17, 164, 184, 0.4);
      }
      .support-icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }
      .description {
        margin-top: 16px;
        color: #657985;
        font-size: 0.95rem;
        line-height: 1.6;
      }
    </style>
    <!--BEGIN OF RAYCHAT CODE-->
    <script type="text/javascript">
      window.RAYCHAT_TOKEN = "53790d09-103f-40d5-b646-5c45d494ad17";
      window.RAYCHAT_HIDE_WIDGET_ON_INIT = true;
      (function () {
        var d = document;
        var s = d.createElement("script");
        s.src = "https://widget-react.raychat.io/install/widget.js";
        s.async = 1;
        d.getElementsByTagName("head")[0].appendChild(s);
      })();
    </script>
    <!--END OF RAYCHAT CODE-->
  </head>
  <body>
    <div class="support-container">
      <button class="support-button" id="open-support" type="button">
        <svg class="support-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>پشتیابی آنلاین</span>
      </button>
      <p class="description">برای راهنمایی و پاسخ به سوالات خود با پشتیبانی تماس بگیرید</p>
    </div>
    <script>
      function openRaychat() {
        if (window.Raychat && window.Raychat.openWidget) {
          window.Raychat.openWidget();
        } else {
          // Raychat not ready yet, wait and retry
          var attempts = 0;
          var maxAttempts = 50; // 5 seconds max
          var interval = setInterval(function() {
            attempts++;
            if (window.Raychat && window.Raychat.openWidget) {
              clearInterval(interval);
              window.Raychat.openWidget();
            } else if (attempts >= maxAttempts) {
              clearInterval(interval);
              alert('پشتیابی آنلاین در حال بارگذاری است. لطفاً کمی صبر کنید و دوباره تلاش کنید.');
            }
          }, 100);
        }
      }

      document.getElementById('open-support').addEventListener('click', openRaychat);

      // Also listen for Raychat ready event if available
      window.addEventListener('raychat-ready', function() {
        // Raychat is ready
      });
    </script>
  </body>
</html>
