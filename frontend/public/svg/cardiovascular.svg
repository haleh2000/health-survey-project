<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="500" height="800">
  <title>Sistema Cardiovascular</title>
  <desc>Diagrama esquemático del sistema cardiovascular humano</desc>

  <!-- Body outline -->
  <g id="body-outline" fill="none" stroke="#e5e7eb" stroke-width="1.5">
    <ellipse cx="250" cy="55" rx="40" ry="50" />
    <path d="M 210 95 L 210 105 Q 210 115 200 120 L 140 145 Q 110 155 100 180 L 75 270 L 60 340 L 50 380" />
    <path d="M 290 95 L 290 105 Q 290 115 300 120 L 360 145 Q 390 155 400 180 L 425 270 L 440 340 L 450 380" />
    <path d="M 200 120 L 175 200 L 170 300 L 185 400 L 195 470 L 200 530" />
    <path d="M 300 120 L 325 200 L 330 300 L 315 400 L 305 470 L 300 530" />
    <path d="M 200 530 Q 195 560 190 600 L 185 680 L 180 740 L 170 780" />
    <path d="M 300 530 Q 305 560 310 600 L 315 680 L 320 740 L 330 780" />
  </g>

  <!-- Heart -->
  <g id="heart" data-region="heart" data-region-id="heart" class="body-region interactive">
    <path d="M 230 180 Q 220 165 230 155 Q 240 145 250 155 Q 260 145 270 155 Q 280 165 270 180 L 250 210 Z"
      fill="#ef4444" fill-opacity="0.6" stroke="#dc2626" stroke-width="1.5" />
    <text x="250" y="195" text-anchor="middle" font-size="8" fill="#991b1b">Corazón</text>
  </g>

  <!-- Aorta -->
  <g id="aorta" data-region="aorta_thoracic" data-region-id="aorta_thoracic" class="body-region interactive">
    <path d="M 250 155 L 250 130 Q 250 115 265 115 L 285 115 Q 295 115 295 125 L 295 200 L 290 280 L 280 350 L 270 420"
      fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.7" stroke-linecap="round" />
    <text x="300" y="140" font-size="7" fill="#991b1b">Aorta</text>
  </g>

  <!-- Vena Cava -->
  <g id="vena_cava" data-region="vena_cava" data-region-id="vena_cava" class="body-region interactive">
    <path d="M 245 165 L 240 130 Q 238 115 225 115 L 210 115 Q 200 115 200 125 L 200 200 L 205 280 L 210 350 L 220 420"
      fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round" />
    <text x="185" y="140" font-size="7" fill="#1d4ed8">V. Cava</text>
  </g>

  <!-- Carotid arteries -->
  <g id="carotid_right" data-region="carotid_artery" data-region-id="carotid_artery" class="body-region interactive">
    <path d="M 260 115 L 260 90 L 258 70" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.6" />
    <text x="268" y="85" font-size="6" fill="#991b1b">Carótida D</text>
  </g>
  <g id="carotid_left" data-region="carotid_left" data-region-id="carotid_left" class="body-region interactive">
    <path d="M 240 115 L 240 90 L 242 70" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.6" />
    <text x="218" y="85" font-size="6" fill="#991b1b">Carótida I</text>
  </g>

  <!-- Jugular veins -->
  <g id="jugular_right" data-region="jugular_right" data-region-id="jugular_right" class="body-region interactive">
    <path d="M 270 115 L 272 90 L 270 70" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" />
  </g>
  <g id="jugular_left" data-region="jugular_left" data-region-id="jugular_left" class="body-region interactive">
    <path d="M 230 115 L 228 90 L 230 70" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Subclavian arteries -->
  <g id="subclavian" data-region="subclavian" data-region-id="subclavian" class="body-region interactive">
    <path d="M 285 118 L 340 140" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.6" />
    <path d="M 215 118 L 160 140" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.6" />
  </g>

  <!-- Brachial arteries (arms) -->
  <g id="brachial_right" data-region="brachial_right" data-region-id="brachial_right" class="body-region interactive">
    <path d="M 340 140 L 390 165 L 415 250 L 430 320 L 440 370" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
    <text x="410" y="260" font-size="6" fill="#991b1b">Braquial</text>
  </g>
  <g id="brachial_left" data-region="brachial_left" data-region-id="brachial_left" class="body-region interactive">
    <path d="M 160 140 L 110 165 L 85 250 L 70 320 L 60 370" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Iliac arteries -->
  <g id="iliac" data-region="iliac" data-region-id="iliac" class="body-region interactive">
    <path d="M 270 420 L 290 470 L 300 510" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.6" />
    <path d="M 270 420 L 230 470 L 200 510" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.6" />
    <text x="295" y="465" font-size="6" fill="#991b1b">Ilíaca</text>
  </g>

  <!-- Femoral arteries -->
  <g id="femoral_right" data-region="femoral_artery" data-region-id="femoral_artery" class="body-region interactive">
    <path d="M 300 510 L 310 580 L 315 650 L 318 720" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
    <text x="320" y="590" font-size="6" fill="#991b1b">Femoral D</text>
  </g>
  <g id="femoral_left" data-region="femoral_left" data-region-id="femoral_left" class="body-region interactive">
    <path d="M 200 510 L 190 580 L 185 650 L 182 720" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
    <text x="165" y="590" font-size="6" fill="#991b1b">Femoral I</text>
  </g>

  <!-- Pulmonary arteries -->
  <g id="pulmonary" data-region="pulmonary" data-region-id="pulmonary" class="body-region interactive">
    <path d="M 240 170 Q 220 165 210 175 L 195 195" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5" />
    <path d="M 260 170 Q 280 165 290 175 L 305 195" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5" />
    <text x="250" y="230" text-anchor="middle" font-size="6" fill="#4338ca">Pulmonares</text>
  </g>

  <!-- Iliac veins -->
  <g id="iliac_veins" data-region="iliac_veins" data-region-id="iliac_veins" class="body-region interactive">
    <path d="M 220 420 L 205 470 L 195 510" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" />
    <path d="M 220 420 L 280 470 L 295 510" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" />
  </g>
</svg>
