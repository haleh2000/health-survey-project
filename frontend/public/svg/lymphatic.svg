<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="500" height="800">
  <title>Sistema Linfático</title>
  <desc>Diagrama esquemático del sistema linfático humano</desc>

  <!-- Body outline -->
  <g id="body-outline" fill="none" stroke="#e5e7eb" stroke-width="1.5">
    <ellipse cx="250" cy="55" rx="40" ry="50" />
    <path d="M 210 95 L 210 105 Q 210 115 200 120 L 140 145 Q 110 155 100 180 L 75 270 L 60 340 L 50 380" />
    <path d="M 290 95 L 290 105 Q 290 115 300 120 L 360 145 Q 390 155 400 180 L 425 270 L 440 340 L 450 380" />
    <path d="M 200 120 L 175 200 L 170 300 L 185 400 L 195 470 L 200 530" />
    <path d="M 300 120 L 325 200 L 330 300 L 315 400 L 305 470 L 300 530" />
    <path d="M 200 530 Q 195 560 190 600 L 185 680 L 180 740 L 170 780" />
    <path d="M 300 530 Q 305 560 310 600 L 315 680 L 320 740 L 330 780" />
  </g>

  <!-- Cervical lymph nodes -->
  <g id="cervical_nodes" data-region="lymph_nodes_cervical" data-region-id="lymph_nodes_cervical" class="body-region interactive">
    <circle cx="230" cy="85" r="5" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="270" cy="85" r="5" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="225" cy="95" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="275" cy="95" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="250" y="78" text-anchor="middle" font-size="7" fill="#166534">Ganglios cervicales</text>
  </g>

  <!-- Supraclavicular nodes -->
  <g id="supraclavicular" data-region="supraclavicular" data-region-id="supraclavicular" class="body-region interactive">
    <circle cx="215" cy="112" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="285" cy="112" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
  </g>

  <!-- Axillary lymph nodes -->
  <g id="axillary_right" data-region="axillary_nodes_right" data-region-id="axillary_nodes_right" class="body-region interactive">
    <circle cx="330" cy="145" r="6" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="340" cy="155" r="5" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="325" cy="158" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="355" y="150" font-size="7" fill="#166534">Axilares D</text>
  </g>
  <g id="axillary_left" data-region="axillary_nodes_left" data-region-id="axillary_nodes_left" class="body-region interactive">
    <circle cx="170" cy="145" r="6" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="160" cy="155" r="5" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="175" cy="158" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="130" y="150" font-size="7" fill="#166534">Axilares I</text>
  </g>

  <!-- Thymus -->
  <g id="thymus" data-region="thymus" data-region-id="thymus" class="body-region interactive">
    <path d="M 240 140 Q 250 130 260 140 L 260 170 Q 250 180 240 170 Z"
      fill="#86efac" fill-opacity="0.4" stroke="#16a34a" stroke-width="1.5" />
    <text x="250" y="160" text-anchor="middle" font-size="7" fill="#166534">Timo</text>
  </g>

  <!-- Thoracic duct -->
  <g id="thoracic_duct" data-region="thoracic_duct" data-region-id="thoracic_duct" class="body-region interactive">
    <path d="M 250 460 L 248 400 L 246 330 L 244 250 L 242 180 L 240 140 L 235 120"
      fill="none" stroke="#22c55e" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" />
    <text x="228" y="250" font-size="6" fill="#166534" transform="rotate(-90, 228, 250)">Conducto torácico</text>
  </g>

  <!-- Mediastinal nodes -->
  <g id="mediastinal" data-region="mediastinal_nodes" data-region-id="mediastinal_nodes" class="body-region interactive">
    <circle cx="245" cy="195" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="255" cy="200" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="248" cy="210" r="3" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
  </g>

  <!-- Spleen -->
  <g id="spleen" data-region="spleen" data-region-id="spleen" class="body-region interactive">
    <ellipse cx="320" cy="290" rx="20" ry="30" fill="#a855f7" fill-opacity="0.3" stroke="#9333ea" stroke-width="1.5" />
    <text x="320" y="295" text-anchor="middle" font-size="8" fill="#6b21a8">Bazo</text>
  </g>

  <!-- Mesenteric nodes -->
  <g id="mesenteric" data-region="mesenteric_nodes" data-region-id="mesenteric_nodes" class="body-region interactive">
    <circle cx="240" cy="350" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="255" cy="340" r="3" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="260" cy="360" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="245" cy="370" r="3" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="275" y="355" font-size="6" fill="#166534">Mesentéricos</text>
  </g>

  <!-- Para-aortic nodes -->
  <g id="paraaortic" data-region="paraaortic_nodes" data-region-id="paraaortic_nodes" class="body-region interactive">
    <circle cx="250" cy="400" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="250" cy="415" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="250" cy="430" r="3" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="265" y="418" font-size="6" fill="#166534">Para-aórticos</text>
  </g>

  <!-- Inguinal lymph nodes -->
  <g id="inguinal_right" data-region="inguinal_nodes_right" data-region-id="inguinal_nodes_right" class="body-region interactive">
    <circle cx="290" cy="500" r="6" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="300" cy="510" r="5" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="285" cy="512" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="310" y="505" font-size="7" fill="#166534">Inguinales D</text>
  </g>
  <g id="inguinal_left" data-region="inguinal_nodes_left" data-region-id="inguinal_nodes_left" class="body-region interactive">
    <circle cx="210" cy="500" r="6" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="200" cy="510" r="5" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <circle cx="215" cy="512" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="165" y="505" font-size="7" fill="#166534">Inguinales I</text>
  </g>

  <!-- Popliteal nodes -->
  <g id="popliteal_right" data-region="popliteal_right" data-region-id="popliteal_right" class="body-region interactive">
    <circle cx="310" cy="650" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="320" y="653" font-size="5" fill="#166534">Poplíteo D</text>
  </g>
  <g id="popliteal_left" data-region="popliteal_left" data-region-id="popliteal_left" class="body-region interactive">
    <circle cx="190" cy="650" r="4" fill="#22c55e" fill-opacity="0.5" stroke="#16a34a" stroke-width="1" />
    <text x="165" y="653" font-size="5" fill="#166534">Poplíteo I</text>
  </g>

  <!-- Lymph vessels (connecting lines) -->
  <g id="lymph_vessels" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" fill="none" stroke-dasharray="4,3">
    <!-- Right side -->
    <path d="M 290 500 L 285 440 L 255 415" />
    <path d="M 300 510 L 310 600 L 310 650" />
    <!-- Left side -->
    <path d="M 210 500 L 215 440 L 245 415" />
    <path d="M 200 510 L 190 600 L 190 650" />
    <!-- Upper connections -->
    <path d="M 250 400 L 250 370" />
    <path d="M 250 340 L 248 300 L 246 250" />
    <path d="M 330 145 L 300 130 L 285 112" />
    <path d="M 170 145 L 200 130 L 215 112" />
  </g>
</svg>
