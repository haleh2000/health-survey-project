<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="500" height="800">
  <title>Sistema Reproductivo</title>
  <desc>Diagrama esquemático del sistema reproductivo femenino y masculino</desc>

  <!-- Title -->
  <text x="250" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">Sistema Reproductivo</text>

  <!-- Divider line -->
  <line x1="250" y1="35" x2="250" y2="730" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- FEMALE SIDE (left) -->
  <text x="125" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">Femenino</text>

  <!-- Body outline — female left half -->
  <g fill="none" stroke="#e5e7eb" stroke-width="1.5">
    <path d="M 180 60 Q 125 65 110 120 Q 105 175 110 240 Q 115 320 120 390 Q 125 460 130 530" />
    <path d="M 180 60 Q 210 65 230 100 Q 240 140 240 200 Q 240 280 238 380 Q 237 460 236 530" />
    <!-- Hip outline -->
    <path d="M 110 390 Q 108 430 112 470 Q 118 510 125 530" />
    <path d="M 238 380 Q 242 420 240 460 Q 238 500 236 530" />
  </g>

  <!-- Útero (Uterus) -->
  <g id="utero" data-region="utero" data-region-id="utero" class="body-region interactive">
    <path d="M 155 310 Q 140 295 135 275 Q 130 255 140 240 Q 150 228 170 228 Q 190 228 198 240 Q 207 255 202 275 Q 197 295 182 310 Q 175 318 168 322 Q 161 318 155 310 Z"
      fill="#EC4899" fill-opacity="0.4" stroke="#be185d" stroke-width="1.8" />
    <!-- Uterine cavity -->
    <path d="M 168 238 L 160 268 Q 165 280 168 282 Q 171 280 176 268 Z"
      fill="#EC4899" fill-opacity="0.3" stroke="#be185d" stroke-width="0.8" />
    <text x="148" y="345" text-anchor="middle" font-size="9" fill="#9d174d">Útero</text>
  </g>

  <!-- Cérvix -->
  <g id="cervix" data-region="cervix" data-region-id="cervix" class="body-region interactive">
    <rect x="160" y="320" width="16" height="22" rx="6" fill="#EC4899" fill-opacity="0.35" stroke="#be185d" stroke-width="1.5" />
    <text x="115" y="336" text-anchor="start" font-size="8" fill="#9d174d">Cérvix</text>
    <line x1="160" y1="332" x2="145" y2="334" stroke="#be185d" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- Vagina -->
  <g id="vagina" data-region="vagina" data-region-id="vagina" class="body-region interactive">
    <path d="M 162 342 Q 158 360 158 380 Q 159 398 168 405 Q 177 398 178 380 Q 178 360 174 342"
      fill="#EC4899" fill-opacity="0.25" stroke="#be185d" stroke-width="1.5" />
    <text x="115" y="378" text-anchor="start" font-size="8" fill="#9d174d">Vagina</text>
    <line x1="158" y1="376" x2="148" y2="375" stroke="#be185d" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- Trompa izquierda (Fallopian tube — patient's left, diagram's left) -->
  <g id="trompa_izquierda" data-region="trompa_izquierda" data-region-id="trompa_izquierda" class="body-region interactive">
    <path d="M 135 245 Q 120 238 112 230 Q 106 222 108 214 Q 114 205 124 210"
      fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />
    <!-- Fimbriae -->
    <path d="M 124 210 Q 118 206 116 200 M 124 210 Q 120 204 122 198 M 124 210 Q 127 204 126 198"
      fill="none" stroke="#be185d" stroke-width="1.2" stroke-linecap="round" />
    <text x="88" y="215" text-anchor="end" font-size="8" fill="#9d174d">Trompa</text>
  </g>

  <!-- Trompa derecha (right fallopian from uterus perspective) -->
  <g id="trompa_derecha" data-region="trompa_derecha" data-region-id="trompa_derecha" class="body-region interactive">
    <path d="M 201 245 Q 214 235 222 226 Q 228 218 226 210 Q 221 202 213 206"
      fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />
    <!-- Fimbriae -->
    <path d="M 213 206 Q 218 201 218 196 M 213 206 Q 215 200 218 198 M 213 206 Q 210 200 212 195"
      fill="none" stroke="#be185d" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Ovario izquierdo (Ovary) -->
  <g id="ovario_izquierdo" data-region="ovario_izquierdo" data-region-id="ovario_izquierdo" class="body-region interactive">
    <ellipse cx="116" cy="224" rx="12" ry="9" fill="#EC4899" fill-opacity="0.5" stroke="#be185d" stroke-width="1.5" />
    <text x="85" y="240" text-anchor="end" font-size="8" fill="#9d174d">Ovario I</text>
  </g>

  <!-- Ovario derecho -->
  <g id="ovario_derecho" data-region="ovario_derecho" data-region-id="ovario_derecho" class="body-region interactive">
    <ellipse cx="222" cy="216" rx="12" ry="9" fill="#EC4899" fill-opacity="0.5" stroke="#be185d" stroke-width="1.5" />
    <text x="235" y="215" text-anchor="start" font-size="8" fill="#9d174d">Ovario D</text>
  </g>

  <!-- Ligamento ancho -->
  <g id="ligamento_ancho" fill="none" stroke="#f9a8d4" stroke-width="1" stroke-dasharray="3,2">
    <path d="M 120 260 Q 140 255 155 260" />
    <path d="M 181 260 Q 196 255 212 260" />
  </g>


  <!-- MALE SIDE (right) -->
  <text x="375" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">Masculino</text>

  <!-- Body outline — male right half -->
  <g fill="none" stroke="#e5e7eb" stroke-width="1.5">
    <path d="M 320 60 Q 265 65 264 100 Q 263 140 263 200 Q 263 280 265 380 Q 266 460 268 530" />
    <path d="M 320 60 Q 380 65 395 120 Q 400 175 395 240 Q 390 320 385 390 Q 380 460 375 530" />
    <!-- Hip outline -->
    <path d="M 268 380 Q 264 420 266 460 Q 268 500 268 530" />
    <path d="M 385 390 Q 388 430 384 470 Q 380 510 375 530" />
  </g>

  <!-- Próstata (Prostate) -->
  <g id="prostata" data-region="prostata" data-region-id="prostata" class="body-region interactive">
    <ellipse cx="325" cy="390" rx="26" ry="20" fill="#EC4899" fill-opacity="0.4" stroke="#be185d" stroke-width="1.8" />
    <!-- Urethra through prostate -->
    <line x1="325" y1="370" x2="325" y2="410" stroke="#be185d" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="360" y="390" text-anchor="start" font-size="9" fill="#9d174d">Próstata</text>
  </g>

  <!-- Vesículas seminales -->
  <g id="vesiculas_seminales" data-region="vesiculas_seminales" data-region-id="vesiculas_seminales" class="body-region interactive">
    <ellipse cx="308" cy="368" rx="12" ry="8" fill="#EC4899" fill-opacity="0.35" stroke="#be185d" stroke-width="1.2" />
    <ellipse cx="342" cy="368" rx="12" ry="8" fill="#EC4899" fill-opacity="0.35" stroke="#be185d" stroke-width="1.2" />
    <text x="360" y="365" text-anchor="start" font-size="8" fill="#9d174d">Vesículas seminales</text>
  </g>

  <!-- Uretra prostática -->
  <g id="uretra_masculina" data-region="uretra_masculina" data-region-id="uretra_masculina" class="body-region interactive">
    <path d="M 325 410 Q 322 445 320 470 Q 318 490 316 510"
      fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />
    <text x="265" y="465" text-anchor="start" font-size="8" fill="#9d174d">Uretra</text>
  </g>

  <!-- Epidídimo -->
  <g id="epididimo" data-region="epididimo" data-region-id="epididimo" class="body-region interactive">
    <path d="M 305 558 Q 300 548 302 535 Q 306 524 314 522"
      fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />
    <path d="M 347 558 Q 352 548 350 535 Q 346 524 338 522"
      fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />
    <text x="360" y="540" text-anchor="start" font-size="8" fill="#9d174d">Epidídimo</text>
    <line x1="350" y1="542" x2="358" y2="539" stroke="#be185d" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- Testículos (Testes) -->
  <g id="testiculos" data-region="testiculos" data-region-id="testiculos" class="body-region interactive">
    <ellipse cx="310" cy="570" rx="20" ry="22" fill="#EC4899" fill-opacity="0.4" stroke="#be185d" stroke-width="1.8" />
    <ellipse cx="342" cy="570" rx="20" ry="22" fill="#EC4899" fill-opacity="0.4" stroke="#be185d" stroke-width="1.8" />
    <!-- Tunica albuginea detail lines -->
    <line x1="304" y1="562" x2="316" y2="578" stroke="#be185d" stroke-width="0.6" stroke-opacity="0.5" />
    <line x1="310" y1="558" x2="310" y2="582" stroke="#be185d" stroke-width="0.6" stroke-opacity="0.5" />
    <line x1="337" y1="562" x2="348" y2="578" stroke="#be185d" stroke-width="0.6" stroke-opacity="0.5" />
    <text x="325" y="608" text-anchor="middle" font-size="9" fill="#9d174d">Testículos</text>
  </g>

  <!-- Conducto deferente -->
  <g id="conducto_deferente" data-region="conducto_deferente" data-region-id="conducto_deferente" class="body-region interactive">
    <path d="M 314 550 Q 312 530 312 510 Q 313 490 315 470 Q 317 450 320 430 Q 322 415 325 410"
      fill="none" stroke="#be185d" stroke-width="1.5" stroke-dasharray="4,2" stroke-linecap="round" />
    <path d="M 338 550 Q 340 530 338 510 Q 337 490 335 470 Q 333 450 330 430 Q 328 415 325 410"
      fill="none" stroke="#be185d" stroke-width="1.5" stroke-dasharray="4,2" stroke-linecap="round" />
    <text x="360" y="500" text-anchor="start" font-size="8" fill="#9d174d">Conducto deferente</text>
    <line x1="340" y1="490" x2="358" y2="498" stroke="#be185d" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(20, 640)">
    <rect x="0" y="0" width="460" height="70" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" />
    <text x="10" y="18" font-size="10" font-weight="bold" fill="#9d174d">Notas clínicas:</text>
    <text x="10" y="34" font-size="8" fill="#be185d">• Útero: cavidad endometrial con ciclo menstrual de 28 días (promedio)</text>
    <text x="10" y="48" font-size="8" fill="#be185d">• Ovarios: producción de estrógenos y progesterona</text>
    <text x="10" y="62" font-size="8" fill="#be185d">• Testículos: producción de testosterona y espermatozoides</text>
  </g>
</svg>
