<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <title>Órganos de los Sentidos</title>
  <desc>Diagrama esquemático de los órganos sensoriales: ojo, oído y nariz</desc>

  <!-- Background -->
  <rect width="500" height="500" fill="#f0fdfc" rx="8" />

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f766e">Órganos de los Sentidos</text>

  <!-- ===== EYE — left panel ===== -->
  <g transform="translate(10, 40)">
    <text x="75" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">Ojo</text>

    <!-- Outer sclera -->
    <g id="escleratica" data-region="escleratica" data-region-id="escleratica" class="body-region interactive">
      <ellipse cx="75" cy="90" rx="60" ry="56" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
      <text x="118" y="62" font-size="7" fill="#475569">Esclerótica</text>
      <line x1="116" y1="64" x2="108" y2="68" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Choroid layer -->
    <ellipse cx="75" cy="90" rx="54" ry="50" fill="#fde8d8" stroke="none" />

    <!-- Retina -->
    <g id="retina" data-region="retina" data-region-id="retina" class="body-region interactive">
      <ellipse cx="75" cy="90" rx="48" ry="44" fill="#14B8A6" fill-opacity="0.15" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="118" y="130" font-size="7" fill="#0f766e">Retina</text>
      <line x1="116" y1="128" x2="108" y2="120" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Macula / fovea -->
    <circle cx="95" cy="90" r="5" fill="#0d9488" fill-opacity="0.4" stroke="#0d9488" stroke-width="1" />
    <text x="105" y="88" font-size="6" fill="#0f766e">Mácula</text>

    <!-- Vitreous humor (inside) -->
    <ellipse cx="75" cy="90" rx="36" ry="33" fill="#e0f7fa" fill-opacity="0.6" />

    <!-- Lens (cristalino) -->
    <g id="cristalino" data-region="cristalino" data-region-id="cristalino" class="body-region interactive">
      <ellipse cx="55" cy="90" rx="9" ry="16" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
      <text x="20" y="86" text-anchor="end" font-size="7" fill="#0369a1">Cristalino</text>
      <line x1="22" y1="88" x2="46" y2="90" stroke="#0284c7" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Iris -->
    <g id="iris" data-region="iris" data-region-id="iris" class="body-region interactive">
      <circle cx="32" cy="90" r="18" fill="#14B8A6" fill-opacity="0.5" stroke="#0d9488" stroke-width="1.5" />
      <!-- Pupil -->
      <circle cx="32" cy="90" r="7" fill="#0f172a" />
      <text x="5" y="118" text-anchor="start" font-size="7" fill="#0f766e">Iris / Pupila</text>
      <line x1="20" y1="102" x2="18" y2="113" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Cornea -->
    <g id="cornea" data-region="cornea" data-region-id="cornea" class="body-region interactive">
      <path d="M 15 78 Q 6 90 15 102" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      <text x="3" y="75" text-anchor="start" font-size="7" fill="#0369a1">Córnea</text>
      <line x1="12" y1="77" x2="12" y2="80" stroke="#0284c7" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Optic nerve -->
    <g id="nervio_optico" data-region="nervio_optico" data-region-id="nervio_optico" class="body-region interactive">
      <path d="M 123 90 Q 138 88 148 88" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" />
      <text x="118" y="108" font-size="7" fill="#5b21b6">N. óptico</text>
    </g>

    <!-- Ciliary body label -->
    <text x="60" y="148" font-size="7" fill="#64748b">Cuerpo ciliar</text>
    <line x1="65" y1="145" x2="65" y2="136" stroke="#64748b" stroke-width="0.7" stroke-dasharray="2,2" />

    <!-- Aqueous humor label -->
    <text x="24" y="90" text-anchor="middle" font-size="5" fill="#0369a1">H.acuoso</text>
  </g>

  <!-- ===== EAR — center panel ===== -->
  <g transform="translate(165, 40)">
    <text x="85" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">Oído</text>

    <!-- Outer ear canal -->
    <g id="oido_externo" data-region="oido_externo" data-region-id="oido_externo" class="body-region interactive">
      <path d="M 20 75 Q 20 60 35 58 Q 50 56 55 65 L 60 85 L 55 105 Q 50 114 35 112 Q 20 110 20 95 Z"
        fill="#14B8A6" fill-opacity="0.2" stroke="#0d9488" stroke-width="1.5" />
      <path d="M 60 72 L 78 75" fill="none" stroke="#0d9488" stroke-width="3" />
      <path d="M 60 98 L 78 95" fill="none" stroke="#0d9488" stroke-width="3" />
      <text x="15" y="55" font-size="7" fill="#0f766e">Pabellón</text>
      <text x="15" y="65" font-size="7" fill="#0f766e">auricular</text>
      <text x="55" y="150" text-anchor="middle" font-size="7" fill="#0f766e">Canal</text>
      <text x="55" y="160" text-anchor="middle" font-size="7" fill="#0f766e">auditivo</text>
      <line x1="55" y1="148" x2="69" y2="120" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Eardrum (tympanum) -->
    <g id="timpano" data-region="timpano" data-region-id="timpano" class="body-region interactive">
      <line x1="78" y1="70" x2="78" y2="100" stroke="#0d9488" stroke-width="4" stroke-linecap="round" />
      <text x="60" y="130" font-size="7" fill="#0f766e">Tímpano</text>
      <line x1="75" y1="128" x2="78" y2="104" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Middle ear cavity -->
    <rect x="78" y="65" width="40" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" />

    <!-- Ossicles (huesecillos) -->
    <g id="huesecillos" data-region="huesecillos" data-region-id="huesecillos" class="body-region interactive">
      <!-- Malleus -->
      <path d="M 82 72 L 86 85 L 84 88 L 86 90 L 90 86" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Incus -->
      <path d="M 90 82 L 98 82 L 102 88" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Stapes -->
      <path d="M 102 84 Q 108 80 112 84 Q 114 88 112 92 Q 108 96 102 92 L 102 84"
        fill="#fde68a" stroke="#92400e" stroke-width="1.5" />
      <text x="78" y="148" font-size="7" fill="#92400e">Huesecillos</text>
      <text x="78" y="158" font-size="6" fill="#92400e">(Martillo, Yunque, Estribo)</text>
      <line x1="90" y1="146" x2="90" y2="100" stroke="#92400e" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Cochlea -->
    <g id="coclea" data-region="coclea" data-region-id="coclea" class="body-region interactive">
      <path d="M 118 85 Q 130 72 145 78 Q 158 85 158 98 Q 158 112 145 118 Q 135 122 126 116 Q 120 110 122 102 Q 124 96 130 94 Q 136 92 138 98 Q 140 104 135 107"
        fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" />
      <text x="138" y="128" font-size="7" fill="#0f766e">Cóclea</text>
    </g>

    <!-- Eustachian tube -->
    <g id="trompa_eustaquio" data-region="trompa_eustaquio" data-region-id="trompa_eustaquio" class="body-region interactive">
      <path d="M 90 105 Q 88 118 82 128 Q 76 136 70 140"
        fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round" />
      <text x="48" y="175" font-size="7" fill="#4338ca">Tr. de Eustaquio</text>
      <line x1="66" y1="173" x2="68" y2="145" stroke="#6366f1" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Semicircular canals (vestibular) -->
    <g id="canales_semicirculares" data-region="canales_semicirculares" data-region-id="canales_semicirculares" class="body-region interactive">
      <path d="M 130 68 Q 148 55 162 62 Q 170 68 165 78" fill="none" stroke="#8b5cf6" stroke-width="1.8" />
      <path d="M 135 66 Q 150 50 165 56 Q 172 63 166 72" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="152" y="50" font-size="7" fill="#6d28d9">Canales</text>
      <text x="152" y="60" font-size="7" fill="#6d28d9">semicirculares</text>
    </g>

    <!-- Auditory nerve -->
    <g id="nervio_auditivo" data-region="nervio_auditivo" data-region-id="nervio_auditivo" class="body-region interactive">
      <path d="M 155 100 Q 162 100 168 102" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
      <text x="152" y="118" font-size="7" fill="#5b21b6">N. auditivo</text>
    </g>
  </g>

  <!-- ===== NOSE — right panel ===== -->
  <g transform="translate(330, 40)">
    <text x="80" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">Nariz</text>

    <!-- Nasal septum (outline of sagittal cross-section) -->
    <g id="tabique_nasal" data-region="tabique_nasal" data-region-id="tabique_nasal" class="body-region interactive">
      <!-- Outer nose profile -->
      <path d="M 80 30 Q 95 28 102 40 Q 108 52 106 68 Q 104 80 100 88 L 100 130 L 60 130 L 60 88 Q 56 80 54 68 Q 52 52 58 40 Q 65 28 80 30 Z"
        fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" />
      <!-- Septum center line -->
      <line x1="80" y1="30" x2="80" y2="130" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="80" y="145" text-anchor="middle" font-size="7" fill="#0f766e">Tabique nasal</text>
    </g>

    <!-- Upper turbinate (cornete superior) -->
    <g id="cornetes" data-region="cornetes" data-region-id="cornetes" class="body-region interactive">
      <!-- Superior turbinate -->
      <path d="M 65 52 Q 78 48 92 52 Q 96 58 90 62 Q 78 65 65 62 Z"
        fill="#14B8A6" fill-opacity="0.35" stroke="#0d9488" stroke-width="1.2" />
      <!-- Middle turbinate -->
      <path d="M 62 72 Q 78 66 95 72 Q 100 80 92 85 Q 78 88 65 85 Q 60 79 62 72 Z"
        fill="#14B8A6" fill-opacity="0.3" stroke="#0d9488" stroke-width="1.2" />
      <!-- Inferior turbinate -->
      <path d="M 62 96 Q 78 90 96 96 Q 100 104 92 108 Q 78 112 65 108 Q 60 102 62 96 Z"
        fill="#14B8A6" fill-opacity="0.25" stroke="#0d9488" stroke-width="1.2" />
      <text x="108" y="56" font-size="7" fill="#0f766e">Cornete sup.</text>
      <text x="108" y="78" font-size="7" fill="#0f766e">Cornete med.</text>
      <text x="108" y="100" font-size="7" fill="#0f766e">Cornete inf.</text>
      <line x1="107" y1="55" x2="96" y2="56" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
      <line x1="107" y1="76" x2="98" y2="76" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
      <line x1="107" y1="98" x2="98" y2="100" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Paranasal sinuses (outline) -->
    <g id="senos_paranasales" data-region="senos_paranasales" data-region-id="senos_paranasales" class="body-region interactive">
      <!-- Maxillary sinus hint -->
      <ellipse cx="80" cy="160" rx="30" ry="22" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" stroke-dasharray="3,2" />
      <text x="80" y="164" text-anchor="middle" font-size="7" fill="#0f766e">Seno maxilar</text>
      <!-- Frontal sinus hint -->
      <path d="M 62 28 Q 80 20 98 28 Q 100 38 80 40 Q 60 38 62 28 Z"
        fill="#ccfbf1" stroke="#0d9488" stroke-width="1" stroke-dasharray="3,2" />
      <text x="80" y="22" text-anchor="middle" font-size="6" fill="#0f766e">Seno frontal</text>
    </g>

    <!-- Olfactory epithelium -->
    <g id="epitelio_olfatorio" data-region="epitelio_olfatorio" data-region-id="epitelio_olfatorio" class="body-region interactive">
      <path d="M 65 36 Q 80 34 95 36" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <text x="8" y="36" text-anchor="start" font-size="7" fill="#b45309">Ep. olfatorio</text>
      <line x1="40" y1="35" x2="64" y2="36" stroke="#f59e0b" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Nasal opening -->
    <path d="M 67 130 Q 65 136 65 140 Q 68 145 80 145 Q 92 145 95 140 Q 95 136 93 130"
      fill="none" stroke="#0d9488" stroke-width="1.5" />
    <text x="80" y="188" text-anchor="middle" font-size="7" fill="#0f766e">Fosas nasales</text>
  </g>

  <!-- Panel dividers -->
  <line x1="163" y1="45" x2="163" y2="470" stroke="#ccfbf1" stroke-width="1.5" />
  <line x1="328" y1="45" x2="328" y2="470" stroke="#ccfbf1" stroke-width="1.5" />

  <!-- Bottom legend -->
  <g transform="translate(10, 390)">
    <rect x="0" y="0" width="480" height="90" rx="6" fill="#f0fdfc" stroke="#99f6e4" stroke-width="1" />
    <text x="10" y="16" font-size="10" font-weight="bold" fill="#0f766e">Sistemas involucrados:</text>
    <text x="10" y="30" font-size="8" fill="#0d9488">• Visión: células fotoreceptoras (conos y bastones) → nervio óptico → corteza visual (lóbulo occipital)</text>
    <text x="10" y="44" font-size="8" fill="#0d9488">• Audición: vibración mecánica → células ciliadas en cóclea → nervio auditivo → corteza auditiva</text>
    <text x="10" y="58" font-size="8" fill="#0d9488">• Olfato: moléculas odorantes → epitelio olfatorio → bulbo olfatorio → corteza límbica</text>
    <text x="10" y="72" font-size="8" fill="#0d9488">• Equilibrio: canales semicirculares y otolitos (utrículo y sáculo) → vestíbulo → cerebelo</text>
  </g>
</svg>
