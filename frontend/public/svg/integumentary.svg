<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <title>Sistema Tegumentario</title>
  <desc>Diagrama de corte transversal de la piel — sistema tegumentario</desc>

  <!-- Background -->
  <rect width="500" height="500" fill="#fff7ed" rx="8" />

  <!-- Title -->
  <text x="250" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">Sistema Tegumentario</text>
  <text x="250" y="38" text-anchor="middle" font-size="10" fill="#9a3412">Corte transversal de la piel</text>

  <!-- Surface line (top of skin) -->
  <g id="superficie_piel">
    <!-- Skin surface with slight undulation -->
    <path d="M 30 60 Q 80 52 130 60 Q 180 68 230 60 Q 280 52 330 60 Q 380 68 430 60 L 470 60"
      fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <text x="248" y="56" text-anchor="end" font-size="8" fill="#c2410c">Superficie</text>
  </g>

  <!-- ===== EPIDERMIS layer ===== -->
  <g id="epidermis" data-region="epidermis" data-region-id="epidermis" class="body-region interactive">
    <!-- Epidermis fill -->
    <path d="M 30 60 Q 80 52 130 60 Q 180 68 230 60 Q 280 52 330 60 Q 380 68 430 60 L 470 60 L 470 110 L 30 110 Z"
      fill="#F97316" fill-opacity="0.22" stroke="#ea580c" stroke-width="1.5" />

    <!-- Stratum corneum (outermost) — hatching lines -->
    <g fill="none" stroke="#F97316" stroke-width="0.6" stroke-opacity="0.5">
      <line x1="30" y1="68" x2="470" y2="68" stroke-dasharray="4,3" />
      <line x1="30" y1="76" x2="470" y2="76" stroke-dasharray="4,3" />
    </g>
    <!-- Melanocytes dots -->
    <circle cx="120" cy="106" r="3.5" fill="#92400e" />
    <circle cx="200" cy="106" r="3.5" fill="#92400e" />
    <circle cx="290" cy="106" r="3.5" fill="#92400e" />
    <circle cx="370" cy="106" r="3.5" fill="#92400e" />

    <!-- Label -->
    <text x="250" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">Epidermis</text>
    <text x="250" y="100" text-anchor="middle" font-size="7" fill="#9a3412">(Est. Córneo → Granuloso → Espinoso → Basal)</text>
    <!-- Melanocyte label -->
    <text x="475" y="109" text-anchor="start" font-size="7" fill="#92400e">Melanocitos</text>
    <line x1="374" y1="106" x2="472" y2="107" stroke="#92400e" stroke-width="0.7" stroke-dasharray="2,2" />
  </g>

  <!-- Basement membrane line -->
  <line x1="30" y1="110" x2="470" y2="110" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2" />

  <!-- ===== DERMIS layer ===== -->
  <g id="dermis" data-region="dermis" data-region-id="dermis" class="body-region interactive">
    <rect x="30" y="110" width="440" height="140" fill="#F97316" fill-opacity="0.10" stroke="#ea580c" stroke-width="1.5" />
    <text x="70" y="135" font-size="11" font-weight="bold" fill="#c2410c">Dermis</text>

    <!-- Collagen fibers (wavy lines) -->
    <g fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-opacity="0.8">
      <path d="M 30 130 Q 80 124 130 130 Q 180 136 230 130 Q 280 124 330 130 Q 380 136 430 130 L 470 130" />
      <path d="M 30 148 Q 80 142 130 148 Q 180 154 230 148 Q 280 142 330 148 Q 380 154 430 148 L 470 148" />
      <path d="M 30 166 Q 80 160 130 166 Q 180 172 230 166 Q 280 160 330 166 Q 380 172 430 166 L 470 166" />
      <path d="M 30 184 Q 80 178 130 184 Q 180 190 230 184 Q 280 178 330 184 Q 380 190 430 184 L 470 184" />
      <path d="M 30 202 Q 80 196 130 202 Q 180 208 230 202 Q 280 196 330 202 Q 380 208 430 202 L 470 202" />
    </g>

    <!-- Blood vessels in dermis -->
    <g id="vasos_sanguineos" data-region="vasos_sanguineos" data-region-id="vasos_sanguineos" class="body-region interactive">
      <!-- Capillary loop -->
      <path d="M 155 115 L 155 190 Q 155 200 165 200 L 195 200 Q 205 200 205 190 L 205 115"
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
      <!-- Venule -->
      <path d="M 165 200 L 165 240" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
      <!-- Arteriole -->
      <path d="M 195 200 L 195 240" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
      <text x="137" y="165" text-anchor="end" font-size="7" fill="#b91c1c">Capilar</text>
      <text x="137" y="174" text-anchor="end" font-size="7" fill="#b91c1c">sanguíneo</text>
      <line x1="138" y1="165" x2="153" y2="155" stroke="#ef4444" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>

    <!-- Nerve fibers in dermis -->
    <g id="nervios_dermis" data-region="nervios_dermis" data-region-id="nervios_dermis" class="body-region interactive">
      <path d="M 340 115 Q 355 135 350 155 Q 345 175 360 190 Q 375 205 365 220 L 365 250"
        fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />
      <text x="385" y="175" text-anchor="start" font-size="7" fill="#6d28d9">Fibras nerviosas</text>
      <line x1="383" y1="173" x2="362" y2="173" stroke="#a78bfa" stroke-width="0.7" stroke-dasharray="2,2" />
    </g>
  </g>

  <!-- ===== HAIR FOLLICLE ===== -->
  <g id="foliculo_piloso" data-region="foliculo_piloso" data-region-id="foliculo_piloso" class="body-region interactive">
    <!-- Hair shaft emerging from surface -->
    <line x1="258" y1="20" x2="252" y2="330" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <!-- Follicle sheath -->
    <path d="M 240 108 L 236 270 Q 236 285 252 295 Q 268 285 268 270 L 264 108 Z"
      fill="#fde68a" fill-opacity="0.4" stroke="#d97706" stroke-width="1.5" />
    <!-- Hair bulb -->
    <ellipse cx="252" cy="305" rx="18" ry="14" fill="#fbbf24" fill-opacity="0.5" stroke="#d97706" stroke-width="1.5" />
    <!-- Dermal papilla -->
    <ellipse cx="252" cy="310" rx="8" ry="6" fill="#f59e0b" fill-opacity="0.6" stroke="#d97706" stroke-width="1" />
    <!-- Arrector pili muscle -->
    <path d="M 264 180 Q 285 200 285 240 Q 285 260 275 250"
      fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3,2" />

    <text x="225" y="335" text-anchor="end" font-size="8" fill="#92400e">Folículo piloso</text>
    <line x1="226" y1="330" x2="238" y2="315" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- ===== SEBACEOUS GLAND ===== -->
  <g id="glandula_sebacea" data-region="glandula_sebacea" data-region-id="glandula_sebacea" class="body-region interactive">
    <!-- Gland body -->
    <path d="M 265 155 Q 285 148 295 158 Q 302 168 295 178 Q 285 186 265 180 Q 255 172 260 162 Z"
      fill="#fef08a" fill-opacity="0.7" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Duct to follicle -->
    <path d="M 265 168 L 264 168" fill="none" stroke="#ca8a04" stroke-width="1.5" />
    <text x="310" y="162" text-anchor="start" font-size="8" fill="#a16207">Gl. sebácea</text>
    <line x1="295" y1="163" x2="308" y2="163" stroke="#ca8a04" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- ===== ECCRINE SWEAT GLAND ===== -->
  <g id="glandula_sudoripara" data-region="glandula_sudoripara" data-region-id="glandula_sudoripara" class="body-region interactive">
    <!-- Duct winding up -->
    <path d="M 100 60 Q 94 80 98 100 Q 102 120 96 135 Q 90 150 94 165 Q 98 180 94 200 Q 90 220 96 240 Q 100 255 96 270 Q 92 285 98 300"
      fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" />
    <!-- Coiled secretory portion -->
    <path d="M 98 300 Q 112 308 118 320 Q 122 332 112 338 Q 100 342 92 332 Q 86 320 94 312 Q 102 306 108 314 Q 112 322 104 326"
      fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="310" text-anchor="end" font-size="8" fill="#0e7490">Gl. sudorípara</text>
    <text x="50" y="320" text-anchor="end" font-size="7" fill="#0e7490">(ecrina)</text>
    <line x1="52" y1="316" x2="88" y2="322" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2,2" />
    <!-- Pore on surface -->
    <circle cx="100" cy="60" r="2.5" fill="#06b6d4" stroke="#0284c7" stroke-width="1" />
    <text x="90" y="55" text-anchor="end" font-size="6" fill="#0e7490">Poro</text>
  </g>

  <!-- ===== HYPODERMIS layer ===== -->
  <g id="hipodermis" data-region="hipodermis" data-region-id="hipodermis" class="body-region interactive">
    <rect x="30" y="250" width="440" height="100" rx="0" fill="#F97316" fill-opacity="0.08" stroke="#ea580c" stroke-width="1.5" />
    <text x="70" y="275" font-size="11" font-weight="bold" fill="#c2410c">Hipodermis</text>
    <text x="70" y="289" font-size="8" fill="#9a3412">(tejido adiposo subcutáneo)</text>

    <!-- Fat cells (adipocytes) — circles -->
    <g fill="#fde68a" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1">
      <circle cx="110" cy="300" r="14" />
      <circle cx="137" cy="293" r="12" />
      <circle cx="160" cy="305" r="13" />
      <circle cx="185" cy="295" r="14" />
      <circle cx="212" cy="308" r="12" />
      <circle cx="237" cy="296" r="13" />
      <circle cx="263" cy="305" r="14" />
      <circle cx="290" cy="295" r="12" />
      <circle cx="315" cy="307" r="13" />
      <circle cx="341" cy="295" r="14" />
      <circle cx="367" cy="304" r="12" />
      <circle cx="392" cy="293" r="13" />
      <circle cx="417" cy="305" r="14" />
      <circle cx="123" cy="323" r="11" />
      <circle cx="147" cy="316" r="12" />
      <circle cx="173" cy="325" r="11" />
      <circle cx="200" cy="318" r="12" />
      <circle cx="225" cy="328" r="11" />
      <circle cx="252" cy="318" r="12" />
      <circle cx="278" cy="327" r="11" />
      <circle cx="305" cy="318" r="12" />
      <circle cx="330" cy="327" r="11" />
      <circle cx="357" cy="315" r="12" />
      <circle cx="382" cy="325" r="11" />
      <circle cx="408" cy="315" r="12" />
      <circle cx="436" cy="304" r="11" />
    </g>
  </g>

  <!-- Fascia deep line -->
  <line x1="30" y1="350" x2="470" y2="350" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3" />
  <text x="250" y="366" text-anchor="middle" font-size="8" fill="#c2410c">Fascia profunda</text>

  <!-- Layer dimension arrows -->
  <g fill="none" stroke="#94a3b8" stroke-width="1">
    <!-- Epidermis arrow -->
    <line x1="478" y1="60" x2="478" y2="110" />
    <line x1="474" y1="60" x2="482" y2="60" />
    <line x1="474" y1="110" x2="482" y2="110" />
    <!-- Dermis arrow -->
    <line x1="478" y1="112" x2="478" y2="248" />
    <line x1="474" y1="112" x2="482" y2="112" />
    <line x1="474" y1="248" x2="482" y2="248" />
    <!-- Hypodermis arrow -->
    <line x1="478" y1="252" x2="478" y2="348" />
    <line x1="474" y1="252" x2="482" y2="252" />
    <line x1="474" y1="348" x2="482" y2="348" />
  </g>
  <text x="492" y="90" text-anchor="start" font-size="6" fill="#64748b" transform="rotate(90, 492, 85)">~0.1mm</text>
  <text x="492" y="185" text-anchor="start" font-size="6" fill="#64748b" transform="rotate(90, 492, 180)">1-4mm</text>
  <text x="492" y="305" text-anchor="start" font-size="6" fill="#64748b" transform="rotate(90, 492, 300)">Variable</text>

  <!-- Legend bottom -->
  <g transform="translate(10, 375)">
    <rect x="0" y="0" width="460" height="112" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
    <text x="10" y="16" font-size="10" font-weight="bold" fill="#c2410c">Funciones principales:</text>
    <text x="10" y="30" font-size="8" fill="#ea580c">• Epidermis: barrera protectora, síntesis vitamina D, queratinización, pigmentación</text>
    <text x="10" y="44" font-size="8" fill="#ea580c">• Dermis: soporte estructural (colágeno/elastina), vascularización, inervación táctil</text>
    <text x="10" y="58" font-size="8" fill="#ea580c">• Hipodermis: aislamiento térmico, reserva energética, amortiguación mecánica</text>
    <text x="10" y="72" font-size="8" fill="#ea580c">• Folículo piloso: protección UV, regulación temperatura, órgano sensorial</text>
    <text x="10" y="86" font-size="8" fill="#ea580c">• Gl. sudorípara: termorregulación (700-900 mL/día en reposo)</text>
    <text x="10" y="100" font-size="8" fill="#ea580c">• Gl. sebácea: lubricación cutánea, barrera antimicrobiana (sebo)</text>
  </g>
</svg>
